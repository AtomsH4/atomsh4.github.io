<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">轮流计算，不等于轮流占用显存</title><desc id="desc">计算时间轴展示 A 和 B 交替执行；同一时刻的显存中，A 和 B 的模型数据可以同时驻留。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs>
<rect width="960" height="100%" rx="20" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
<text x="40" y="52" font-size="29" fill="#17243b" font-weight="700" text-anchor="start">轮流计算，不等于轮流占用显存</text>
<text x="40" y="88" font-size="22" fill="#42556e" font-weight="400" text-anchor="start">执行时间与显存容量，要分开观察。</text>
<rect x="32" y="112" width="896" height="192" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="151" font-size="24" fill="#17243b" font-weight="650" text-anchor="start">计算时间：A、B 交替推进</text>
<rect x="210" y="172" width="114" height="48" rx="14" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="267.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">A</text>
<rect x="330" y="172" width="84" height="48" rx="14" fill="#b45309" stroke="#b45309" stroke-width="1.5"/>
<text x="372.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">B</text>
<rect x="420" y="172" width="154" height="48" rx="14" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="497.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">A</text>
<rect x="580" y="172" width="84" height="48" rx="14" fill="#b45309" stroke="#b45309" stroke-width="1.5"/>
<text x="622.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">B</text>
<rect x="670" y="172" width="104" height="48" rx="14" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="722.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">A</text>
<rect x="780" y="172" width="94" height="48" rx="14" fill="#b45309" stroke="#b45309" stroke-width="1.5"/>
<text x="827.0" y="204" font-size="25" fill="#ffffff" font-weight="650" text-anchor="middle">B</text>
<text x="56" y="204" font-size="22" fill="#42556e" font-weight="400" text-anchor="start">执行中</text>
<path d="M210 238 L888 238" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="210" y="277" font-size="21" fill="#42556e" font-weight="400" text-anchor="start">示意：时长不固定，也不保证按 Pod 均分。</text>
<rect x="32" y="335" width="896" height="213" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="375" font-size="24" fill="#17243b" font-weight="650" text-anchor="start">同一时刻：模型和数据仍可同时留在显存</text>
<rect x="120" y="404" width="116" height="54" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="178.0" y="439" font-size="22" fill="#1d4ed8" font-weight="650" text-anchor="middle">A  4 GiB</text>
<rect x="240" y="404" width="236" height="54" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="358.0" y="439" font-size="22" fill="#b45309" font-weight="650" text-anchor="middle">B  8 GiB</text>
<rect x="480" y="404" width="356" height="54" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="658.0" y="439" font-size="22" fill="#42556e" font-weight="650" text-anchor="middle">剩余 12 GiB</text>
<text x="56" y="497" font-size="22" fill="#42556e" font-weight="400" text-anchor="start">A 暂停计算时，也可能仍占着 4 GiB 显存。</text>
<text x="56" y="530" font-size="20" fill="#42556e" font-weight="400" text-anchor="start">色块表示用量，不表示连续的物理地址分区。</text>
</g>
</svg>
